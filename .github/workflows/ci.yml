name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # PostgreSQL de verdade só para rodar os SQLs de prisma/sql/ nos testes (ex.: migração de dados)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico para comparar com a base do PR (schema x SQL)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schema alterado exige SQL em prisma/sql/
        if: github.event_name == 'pull_request'
        run: bash scripts/checar-sql-schema.sh "origin/${{ github.base_ref }}"
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run typecheck
      - run: npm test
        env:
          PG_TESTE_URL: postgresql://ci:ci@localhost:5432/ci
