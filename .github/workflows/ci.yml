name: CI

on:
  pull_request:
  push:
    branches: [master]

# Um push novo no MESMO PR cancela o run anterior (não desperdiça runner nem fica em fila).
# No master cada merge roda até o fim (nunca cancela a validação de um commit da base).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Typecheck + validações rápidas (não precisa de Postgres): roda em paralelo com os shards de teste.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # histórico para comparar com a base do PR (schema x SQL)
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Schema alterado exige SQL em prisma/sql/
        if: github.event_name == 'pull_request'
        run: bash scripts/checar-sql-schema.sh "origin/${{ github.base_ref }}"
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run typecheck

  # A suíte (Postgres real) dividida em shards PARALELOS: baixa o tempo de parede sem tirar nenhum teste.
  # Cada shard é um job isolado com seu próprio Postgres; os testes usam schema por processo, sem colisão.
  testes:
    name: Testes (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false # um shard vermelho não aborta os outros: vê-se tudo que falhou numa rodada
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Os testes de Postgres rodam em paralelo, cada um com o seu schema, e no fim apagam o schema inteiro
      # (DROP SCHEMA ... CASCADE: ~400 objetos numa transação só). Com vários apagando ao mesmo tempo, a tabela
      # de travas padrão (64 por conexão) esgota ("out of shared memory"). Mais travas = mesma suíte, sem corrida.
      - name: Postgres com mais travas por transação
        run: |
          docker exec ${{ job.services.postgres.id }} psql -U ci -d ci -c "ALTER SYSTEM SET max_locks_per_transaction = 512"
          docker restart ${{ job.services.postgres.id }}
          for i in $(seq 1 30); do docker exec ${{ job.services.postgres.id }} pg_isready -U ci -d ci && break; sleep 1; done
          docker exec ${{ job.services.postgres.id }} psql -U ci -d ci -Atc "show max_locks_per_transaction"
      - name: Testes (vitest, shard ${{ matrix.shard }}/4)
        run: npm test -- --shard=${{ matrix.shard }}/4
        env:
          PG_TESTE_URL: postgresql://ci:ci@localhost:5432/ci

  # Build de produção (o mesmo `npm run build` do deploy): pega o que typecheck e testes não pegam —
  # assinatura de página inválida, erro na geração das páginas, import que só quebra no bundle.
  # Não usa banco: nenhuma página consulta dados no build; a DATABASE_URL é fictícia (ninguém escuta nela).
  build:
    name: Build de produção
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXT_TELEMETRY_DISABLED: 1
      # A checagem de tipos do `next build` passa de 2 GB de heap neste projeto (o padrão do Node estoura).
      # Com as levas J e H juntas ela encostou em 4 GB (pico ~4,2 GB de RSS) e estourou no CI: 6 GB dá folga
      # (o runner do ubuntu-latest tem 16 GB).
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Cache do Next (webpack + tsbuildinfo): reaproveita o que não mudou desde o último build do
      # branch ou, na falta dele, do master. A chave leva o commit para sempre guardar o mais novo.
      - uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-
            next-${{ runner.os }}-
      - run: npm run build

  # Portão único (nome do check preservado): só fica verde com typecheck + TODOS os shards + build verdes.
  checks:
    name: Typecheck e testes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [typecheck, testes, build]
    if: always()
    steps:
      - name: Resultado
        run: |
          echo "typecheck=${{ needs.typecheck.result }} testes=${{ needs.testes.result }} build=${{ needs.build.result }}"
          if [ "${{ needs.typecheck.result }}" = "success" ] && [ "${{ needs.testes.result }}" = "success" ] && [ "${{ needs.build.result }}" = "success" ]; then
            echo "CI verde."
          else
            echo "CI falhou (um deles não ficou verde)."
            exit 1
          fi
